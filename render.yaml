services:
  # The P&L tracker (Swing Trading) at /, behind a password (see
  # src/dashboard_server.py). The Yearly Overview and Net Worth pages live in
  # the FinanceDashboards repo.
  - type: web
    name: finance-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --factory src.dashboard_server:create_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FINANCE_TOKEN
        sync: false
      # Upload data/gsheets_authentication.json as a Secret File named
      # gsheets_authentication.json; Render mounts secret files here
      - key: GSHEETS_AUTH_FILE
        value: /etc/secrets/gsheets_authentication.json
      # The Drive folder holding Fidelity's Accounts_History CSV (same as the
      # GitHub Action's), so the P&L page loads it without an upload
      - key: FIDELITY_DRIVE_FOLDER_ID
        sync: false
      # Menu-bar links to the other dashboards (each hidden when unset)
      - key: FINANCE_DASHBOARD_URL
        sync: false
      - key: NET_WORTH_DASHBOARD_URL
        sync: false
      - key: SPENDING_DASHBOARD_URL
        sync: false
