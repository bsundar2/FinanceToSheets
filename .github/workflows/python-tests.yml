name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11, like the export workflow: pandas is pinned to 2.2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Runs against config/household.example.json (tests/conftest.py); the
      # LibreOffice formula tests skip without libreoffice-calc
      - name: Run tests
        run: python -m pytest tests/ -q
